name: 22 Multi-Dimensional Matrix
on: workflow_dispatch

jobs:
  cross-platform:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20]
        include:
          # Custom pairing
          - os: ubuntu-latest
            node-version: 22
            experimental: true
        exclude:
          # Remove specific invalid configuration
          - os: windows-latest
            node-version: 18
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: echo "Running on ${{ matrix.os }} with Node ${{ matrix.node-version }}"
