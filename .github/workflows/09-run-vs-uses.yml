name: 09 Run vs Uses
on: workflow_dispatch

jobs:
  compare-execution:
    runs-on: ubuntu-latest
    steps:
      # 'uses' calls an external packaged action
      - name: Use marketplace action
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 'run' executes raw shell commands inside the VM
      - name: Run shell commands
        run: |
          node -v
          npm -v
