    # Runs at 02:00 UTC every Monday through Friday
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # Allows manual verification

jobs:
  nightly-job:
    runs-on: ubuntu-latest
    steps:
      - name: Run maintenance
        run: echo "Executing scheduled maintenance task"
