name: 26 Artifacts Matrix Retention
on: workflow_dispatch

jobs:
  build-platforms:
    strategy:
      matrix:
        target: [linux, win]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Binary for ${{ matrix.target }}" > binary.txt
      - uses: actions/upload-artifact@v4
        with:
          # Unique names prevent matrix output overwrite
          name: binary-${{ matrix.target }}
          path: binary.txt
          retention-days: 5
