name: 32 Concurrency Management
on:
  pull_request:
    branches: [main]

# Auto-cancels outdated CI runs for the same branch/PR when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  long-build:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate build workload
        run: |
          echo "Building commit ${{ github.sha }}..."
          sleep 30
