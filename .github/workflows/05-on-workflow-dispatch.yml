name: 05 Workflow Dispatch Inputs
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment tier'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - uat
          - production
      run_integration_tests:
        description: 'Execute integration suite?'
        type: boolean
        default: false

jobs:
  manual-run:
    runs-on: ubuntu-latest
    steps:
      - name: Read user inputs
        run: |
          echo "Target env: ${{ inputs.environment }}"
          echo "Run tests: ${{ inputs.run_integration_tests }}"
