name: 29 Composite Action Demo
on: workflow_dispatch

jobs:
  run-composite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Points to a custom action folder holding an action.yml
      # (e.g., .github/actions/setup-environment/action.yml)
      - name: Run composite action
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Composite action concept
        run: echo "Composite actions combine multiple steps/runs into a single action.yml definition"
