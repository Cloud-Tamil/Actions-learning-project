name: 20 Job Outputs
on: workflow_dispatch

jobs:
  producer:
    runs-on: ubuntu-latest
    outputs:
      generated_hash: ${{ steps.step1.outputs.hash }}
    steps:
      - id: step1
        run: |
          COMPUTED_HASH=$(echo "action-payload" | sha256sum | awk '{print $1}')
          echo "hash=$COMPUTED_HASH" >> "$GITHUB_OUTPUT"

  consumer:
    runs-on: ubuntu-latest
    needs: producer
    steps:
      - name: Read upstream value
        run: echo "Received hash from producer: ${{ needs.producer.outputs.generated_hash }}"
