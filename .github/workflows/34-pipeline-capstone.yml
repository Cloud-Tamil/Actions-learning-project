name: 34 Pipeline Capstone
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Run verification
        run: |
          if [ -f package.json ]; then npm test --if-present; fi

  package:
    runs-on: ubuntu-latest
    needs: test-matrix
    outputs:
      version_tag: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        run: |
          mkdir -p output
          echo "Build artifact $(date +%s)" > output/app.bin
          echo "version=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-app
          path: output/
          retention-days: 2

  deploy:
    runs-on: ubuntu-latest
    needs: package
    environment:
      name: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compiled-app
          path: dist/
      - name: Release deployment
        run: |
          echo "Deploying release ${{ needs.package.outputs.version_tag }}"
          cat dist/app.bin
