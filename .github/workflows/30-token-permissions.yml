name: 30 Token Permissions
on: workflow_dispatch

# Top-level: Restrict GITHUB_TOKEN to read-only by default
permissions:
  contents: read

jobs:
  read-job:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Job runs under minimal read permissions"

  write-job:
    runs-on: ubuntu-latest
    # Elevated permissions scoped strictly to this job
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: echo "Job elevated to create tags/write to PRs"
