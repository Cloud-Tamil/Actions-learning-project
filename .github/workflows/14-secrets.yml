name: 14 Secrets Masking
on: workflow_dispatch

jobs:
  consume-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Use secrets safely
        env:
          MY_SECRET: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub automatically replaces secret values with '***' in logs
          echo "GitHub Token injected into env"
          echo "Length of token: ${#MY_SECRET}"
