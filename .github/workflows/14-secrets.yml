name: 14 - Secrets Handling
on: workflow_dispatch

jobs:
  handle-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest Secret
        env:
          SECRET_VAL: ${{ secrets.MY_API_KEY }}
        run: |
          if [ -z "$SECRET_VAL" ]; then
            echo "MY_API_KEY secret is not populated in repo settings."
          else
            echo "Secret is present. Masked output: $SECRET_VAL"
          fi
