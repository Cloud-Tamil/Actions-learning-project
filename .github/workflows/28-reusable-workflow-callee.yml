name: 28 Reusable Workflow Callee
on:
  workflow_call:
    inputs:
      target-environment:
        required: true
        type: string
    outputs:
      status-result:
        description: "Status outcome"
        value: ${{ jobs.reusable-job.outputs.status }}

jobs:
  reusable-job:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.step-out.outputs.status }}
    steps:
      - id: step-out
        run: |
          echo "Executing inside reusable workflow for ${{ inputs.target-environment }}"
          echo "status=complete" >> "$GITHUB_OUTPUT"
