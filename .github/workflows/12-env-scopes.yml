name: 12 - Environment Variable Scopes

on:
  workflow_dispatch:

# Workflow-level variables
env:
  SCOPE: "workflow-level"
  STAGE: "global"
  GLOBAL_FLAG: "true"

jobs:

  job1:
    name: Test Scopes
    runs-on: ubuntu-latest

    # Job-level variables
    env:
      NAME: "Test"
      SCOPE: "job-level"

    steps:
      - name: Inspect Job 1
        # Step-level variable
        env:
          SCOPE: "step-level"

        run: |
          echo "===== JOB 1 ====="
          echo "SCOPE: $SCOPE"
          echo "STAGE: $STAGE"
          echo "GLOBAL_FLAG: $GLOBAL_FLAG"
          echo "NAME: $NAME"

  job3:
    name: Build Scopes
    runs-on: ubuntu-latest

    # Job-level variable
    env:
      SCOPE: "job-level"

    steps:
      - name: Inspect Job 2
        # Step-level variable
        env:
          SCOPE: "step-level"

        run: |
          echo "===== JOB 2 ====="
          echo "SCOPE: $SCOPE"
          echo "STAGE: $STAGE"
          echo "GLOBAL_FLAG: $GLOBAL_FLAG"
  
  job2:
    name: final Scopes
    runs-on: ubuntu-latest

    # Job-level variable
    env:
      SCOPE: "job-level"

    steps:
      - name: Inspect Job 2
        # Step-level variable
        env:
          NAME: Teacher
          SCOPE: "step-level"

        run: |
          echo "===== JOB 2 ====="
          echo "SCOPE: $SCOPE"
          echo "STAGE: $STAGE"
          echo "GLOBAL_FLAG: $GLOBAL_FLAG"

