name: 12 - Environment Variable Scopes

on:
  workflow_dispatch:

# ============================================================
# WORKFLOW-LEVEL ENVIRONMENT VARIABLES
# Available to ALL jobs and steps
# ============================================================
env:
  SCOPE: "workflow-level"
  STAGE: "global"
  GLOBAL_FLAG: "True"

jobs:

  # ==========================================================
  # JOB 1
  # Demonstrates workflow-level → job-level → step-level
  # ==========================================================
  job1:
    name: Test Scopes
    runs-on: ubuntu-latest

    # JOB-LEVEL variables
    # These override workflow-level variables
    env:
      NAME: "Test"
      SCOPE: "job-level"

    steps:

      - name: Inspect Job 1
        # STEP-LEVEL variable
        # This overrides the job-level SCOPE
        env:
          SCOPE: "step-level"

        run: |
          echo "===== JOB 1 ====="
          echo "SCOPE: $SCOPE"
          echo "STAGE: $STAGE"
          echo "GLOBAL_FLAG: $GLOBAL_FLAG"
          echo "NAME: $NAME"


  # ==========================================================
  # JOB 2
  # Demonstrates job-level SCOPE without NAME
  # ==========================================================
  job2:
    name: Build Scopes
    runs-on: ubuntu-latest

    # JOB-LEVEL variable
    env:
      SCOPE: "job-level"

    steps:

      - name: Inspect Job 2
        # STEP-LEVEL variable
        env:
          SCOPE: "step-level"

        run: |
          echo "===== JOB 2 ====="
          echo "SCOPE: $SCOPE"
          echo "STAGE: $STAGE"
          echo "GLOBAL_FLAG: $GLOBAL_FLAG"


  # ==========================================================
  # JOB 3
  # Demonstrates overriding NAME at STEP level
  # ==========================================================
  job3:
    name: Final Scopes
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Job 3
        run: |
          echo "===== JOB 3 ====="
          echo "SCOPE: $SCOPE"
          echo "STAGE: $STAGE"
          echo "GLOBAL_FLAG: $GLOBAL_FLAG"
          echo "NAME: $NAME"
