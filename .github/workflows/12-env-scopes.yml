name: 12 - Environment Variable Scopes
on: workflow_dispatch

env:
  SCOPE: "workflow-level"
  GLOBAL_FLAG: "true"

jobs:
  test-scopes:
    runs-on: ubuntu-latest
    env:
      SCOPE: "job-level"
    steps:
      - name: Inspect Precedence
        env:
          SCOPE: "step-level"
        run: |
          echo "Current SCOPE (should be 'step-level'): $SCOPE"
          echo "Global flag: $GLOBAL_FLAG"
