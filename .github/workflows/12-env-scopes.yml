name: 12 Environment Variable Scopes
on: workflow_dispatch

env:
  GLOBAL_SCOPE: "Available to all jobs and steps"

jobs:
  scope-demo:
    runs-on: ubuntu-latest
    env:
      JOB_SCOPE: "Available only inside scope-demo job"
    steps:
      - name: Step with local scope
        env:
          STEP_SCOPE: "Available only in this step"
        run: |
          echo "$GLOBAL_SCOPE"
          echo "$JOB_SCOPE"
          echo "$STEP_SCOPE"

      - name: Step without local scope
        run: |
          echo "$GLOBAL_SCOPE"
          echo "$JOB_SCOPE"
          echo "Step scope: ${STEP_SCOPE:-empty}"
