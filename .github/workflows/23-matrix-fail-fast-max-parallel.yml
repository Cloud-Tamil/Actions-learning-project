name: 23 Matrix Tuning
on: workflow_dispatch

jobs:
  tuned-matrix:
    strategy:
      fail-fast: false # Keep other jobs running even if one fails
      max-parallel: 2  # Concurrency limit
      matrix:
        target: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Processing task ${{ matrix.target }}"
