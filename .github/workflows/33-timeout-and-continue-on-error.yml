name: 33 Timeout and Continue On Error
on: workflow_dispatch

jobs:
  resilience-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Hard boundary preventing runaway runner billing
    steps:
      - name: Non-critical linter
        continue-on-error: true # Step fails without breaking the entire workflow
        run: |
          echo "Testing experimental rule..."
          exit 1

      - name: Critical downstream step
        run: echo "This step executes even though the experimental linter failed"
