name: 25 Artifacts Basics
on: workflow_dispatch

jobs:
  build-artifact:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir dist
          echo "production build output" > dist/bundle.js

      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: dist/
          retention-days: 1

  download-artifact:
    runs-on: ubuntu-latest
    needs: build-artifact
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: downloaded/
      - run: cat downloaded/bundle.js
